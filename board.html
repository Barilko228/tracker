<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Борд — задачи Димы</title>
<style>
  :root{
    --bg:#f4f5fa;
    --card:#ffffff;
    --line:#e7e9f0;
    --text:#1c1e26;
    --muted:#7c8195;
    --accent:#7048e8;
    --lime:#82c91e;
    --pink:#e64980;
    --shadow:0 1px 3px rgba(28,30,38,.06),0 8px 24px rgba(28,30,38,.06);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;line-height:1.5;padding:24px 16px 80px}
  .wrap{max-width:1100px;margin:0 auto}

  header{display:flex;flex-wrap:wrap;align-items:flex-end;gap:16px;margin-bottom:8px}
  h1{font-size:clamp(24px,4vw,34px);font-weight:800}
  h1 em{font-style:normal;color:var(--accent)}
  .updated{color:var(--muted);font-size:13px;margin-left:auto;text-align:right}
  #syncState{font-weight:700}
  #syncState.ok{color:var(--lime)} #syncState.busy{color:#f08c00} #syncState.err{color:var(--pink)}

  .goalbar{background:var(--card);border-radius:16px;box-shadow:var(--shadow);padding:14px 18px;margin:14px 0 26px;display:flex;flex-wrap:wrap;gap:8px 24px;align-items:center;font-size:14px}
  .goalbar b{font-size:17px}
  .goalbar .note{color:var(--muted);width:100%;font-size:13px}

  .board{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:16px;align-items:start}
  .col{background:var(--card);border-radius:18px;box-shadow:var(--shadow);padding:16px}
  .col.today{outline:2px solid var(--accent)}
  .col h2{font-size:15px;font-weight:800;display:flex;align-items:baseline;gap:8px;margin-bottom:4px}
  .col h2 .cnt{color:var(--muted);font-weight:600;font-size:13px}
  .col .cap{color:var(--muted);font-size:12.5px;margin-bottom:10px;min-height:16px}
  .progress{height:6px;background:var(--line);border-radius:3px;margin-bottom:12px;overflow:hidden}
  .progress i{display:block;height:100%;background:var(--lime);border-radius:3px;transition:width .3s}

  .task{display:flex;gap:10px;align-items:flex-start;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px}
  .task.done{opacity:.55}
  .task.done .title{text-decoration:line-through}
  .task input[type=checkbox]{width:19px;height:19px;margin-top:2px;accent-color:var(--lime);cursor:pointer;flex-shrink:0}
  .task .body{flex:1;min-width:0}
  .task .title{font-size:14px;font-weight:600}
  .task .sub{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:4px;font-size:12px;color:var(--muted)}
  .chip{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:1px 9px;font-size:11.5px;font-weight:700;color:#fff}
  .tag{background:#fff3bf;color:#997a00;border-radius:999px;padding:1px 8px;font-size:11px;font-weight:700}
  .task .note{font-size:12px;color:var(--muted);margin-top:3px}
  .task .ops{display:flex;gap:4px;flex-shrink:0}
  .task select{border:1px solid var(--line);border-radius:8px;background:#fff;font-size:11.5px;color:var(--muted);padding:2px 4px;max-width:86px;cursor:pointer}
  .task .del{border:none;background:none;color:#c3c7d4;font-size:15px;cursor:pointer;padding:0 2px}
  .task .del:hover{color:var(--pink)}

  .add{display:flex;gap:6px;margin-top:10px}
  .add input{flex:1;border:1px dashed #c9cdda;border-radius:10px;padding:8px 10px;font-size:13px;background:transparent}
  .add input:focus{outline:2px solid var(--accent);border-color:transparent;background:#fff}
  .add select{border:1px solid var(--line);border-radius:10px;background:#fff;font-size:12px;padding:0 4px;cursor:pointer}
  .add button{border:none;background:var(--accent);color:#fff;border-radius:10px;padding:0 13px;font-size:18px;font-weight:700;cursor:pointer}

  .backlog-group{margin-bottom:14px}
  .backlog-group h3{font-size:13px;font-weight:800;margin-bottom:6px;display:flex;gap:6px;align-items:center}

  /* setup */
  #setup{max-width:560px;margin:60px auto;background:var(--card);border-radius:20px;box-shadow:var(--shadow);padding:32px}
  #setup h2{font-size:20px;margin-bottom:12px}
  #setup ol{margin:0 0 16px 20px;font-size:14px;display:grid;gap:8px}
  #setup code{background:var(--bg);border-radius:6px;padding:1px 6px;font-size:12.5px}
  #setup input{width:100%;border:1px solid var(--line);border-radius:10px;padding:11px 12px;font-size:14px;margin-bottom:10px}
  #setup button{width:100%;border:none;background:var(--accent);color:#fff;border-radius:10px;padding:12px;font-size:15px;font-weight:700;cursor:pointer}
  #setup .err{color:var(--pink);font-size:13px;margin-top:8px;min-height:18px}
  .ghost{border:none;background:none;color:var(--muted);font-size:12.5px;cursor:pointer;text-decoration:underline}
  @media(max-width:520px){body{padding:16px 10px 60px}}
</style>
</head>
<body>
<div class="wrap">

  <div id="setup" hidden>
    <h2>🔑 Подключи борд к базе</h2>
    <ol>
      <li>Открой <a href="https://github.com/settings/personal-access-tokens/new" target="_blank">github.com/settings/personal-access-tokens/new</a></li>
      <li><b>Repository access</b> → Only select repositories → <code>Barilko228/business-brain</code></li>
      <li><b>Permissions</b> → Contents → <b>Read and write</b></li>
      <li>Expiration — 90 дней (потом обновишь), Generate token, скопируй</li>
    </ol>
    <input id="tokenInput" type="password" placeholder="github_pat_…" autocomplete="off">
    <button onclick="saveToken()">Подключить</button>
    <div class="err" id="setupErr"></div>
  </div>

  <div id="app" hidden>
    <header>
      <h1>План: <em>бам-бам-бам</em> 🎯</h1>
      <div class="updated">
        <span id="syncState">✓</span> <span id="updatedAt"></span><br>
        <button class="ghost" onclick="resetToken()">сменить токен</button>
      </div>
    </header>
    <div class="goalbar" id="goalbar"></div>
    <div class="board" id="board"></div>
  </div>

</div>

<script>
const REPO = 'Barilko228/business-brain';
const PATH = 'plan/tasks.json';
const API  = `https://api.github.com/repos/${REPO}/contents/${encodeURIComponent(PATH).replace(/%2F/g,'/')}`;
let DATA = null, SHA = null, saveTimer = null;

const $ = s => document.querySelector(s);
const token = () => localStorage.getItem('bb_token') || '';
const todayISO = () => new Date().toLocaleDateString('sv-SE',{timeZone:'Europe/Moscow'});
const addDays = (iso,n) => { const d=new Date(iso+'T12:00:00'); d.setDate(d.getDate()+n); return d.toISOString().slice(0,10); };
const dayName = iso => { const t=todayISO(); if(iso===t) return 'Сегодня'; if(iso===addDays(t,1)) return 'Завтра';
  return new Date(iso+'T12:00:00').toLocaleDateString('ru-RU',{weekday:'long',day:'numeric',month:'long'}).replace(/^./,c=>c.toUpperCase()); };

/* utf-8 safe base64 */
const b64dec = b => new TextDecoder().decode(Uint8Array.from(atob(b.replace(/\n/g,'')), c=>c.charCodeAt(0)));
const b64enc = s => { const u=new TextEncoder().encode(s); let bin=''; u.forEach(c=>bin+=String.fromCharCode(c)); return btoa(bin); };

async function gh(method, body){
  const r = await fetch(API + (method==='GET' ? '?t='+Date.now() : ''), {
    method,
    headers: { 'Authorization':'Bearer '+token(), 'Accept':'application/vnd.github+json', 'X-GitHub-Api-Version':'2022-11-28' },
    body: body ? JSON.stringify(body) : undefined
  });
  if(!r.ok) throw new Error(method+' '+r.status);
  return r.json();
}

async function load(){
  const j = await gh('GET');
  SHA = j.sha;
  DATA = JSON.parse(b64dec(j.content));
}

function setState(cls, txt){ const el=$('#syncState'); el.className=cls; el.textContent=txt; }

function scheduleSave(){
  setState('busy','⏳ сохраняю…');
  clearTimeout(saveTimer);
  saveTimer = setTimeout(saveNow, 900);
}
async function saveNow(){
  try{
    DATA.updated = new Date().toISOString();
    const res = await gh('PUT', { message:'board: правки с борда', content:b64enc(JSON.stringify(DATA,null,2)), sha:SHA });
    SHA = res.content.sha;
    setState('ok','✓ сохранено');
  }catch(e){
    if(String(e).includes('409')){ try{ const j=await gh('GET'); SHA=j.sha; return saveNow(); }catch(_){} }
    setState('err','⚠️ не сохранилось — обнови страницу');
  }
}

function dirChip(d){
  const dir = DATA.dirs[d] || {name:d,emoji:'',color:'#868e96'};
  return `<span class="chip" style="background:${dir.color}">${dir.emoji} ${dir.name}</span>`;
}
function dayOptions(cur){
  const t = todayISO();
  let opts = [['','📥 Бэклог']];
  for(let i=0;i<7;i++){ const d=addDays(t,i); opts.push([d, i===0?'Сегодня':i===1?'Завтра':new Date(d+'T12:00:00').toLocaleDateString('ru-RU',{weekday:'short',day:'numeric'})]); }
  if(cur && !opts.some(o=>o[0]===cur)) opts.push([cur,cur]);
  return opts.map(([v,l])=>`<option value="${v}" ${v===(cur||'')?'selected':''}>${l}</option>`).join('');
}
function taskHTML(t){
  return `<div class="task ${t.done?'done':''}" data-id="${t.id}">
    <input type="checkbox" ${t.done?'checked':''} onchange="toggle('${t.id}')">
    <div class="body">
      <div class="title">${t.title}</div>
      <div class="sub">${dirChip(t.dir)} <span>${t.est||''}</span> ${t.tag?`<span class="tag">${t.tag}</span>`:''}</div>
      ${t.note?`<div class="note">${t.note}</div>`:''}
    </div>
    <div class="ops">
      <select onchange="move('${t.id}', this.value)" title="перенести">${dayOptions(t.day)}</select>
      <button class="del" onclick="del('${t.id}')" title="удалить">✕</button>
    </div>
  </div>`;
}
function addForm(day){
  const dirs = Object.entries(DATA.dirs).map(([k,d])=>`<option value="${k}">${d.emoji} ${d.name}</option>`).join('');
  return `<div class="add">
    <input placeholder="новая задача…" onkeydown="if(event.key==='Enter')addTask(this,'${day||''}')">
    <select>${dirs}</select>
    <button onclick="addTask(this.parentElement.querySelector('input'),'${day||''}')">+</button>
  </div>`;
}

function render(){
  const m = DATA.meta;
  $('#goalbar').innerHTML =
    `<span>🎯 Цель: <b>${m.goal.toLocaleString('ru-RU')} ${m.goalLabel}</b></span>`+
    `<span>📅 ${m.monthLabel}: <b>${(m.monthFact||0).toLocaleString('ru-RU')} ₽</b></span>`+
    `<span>🏆 ${m.bestFactLabel}: <b>${m.bestFact.toLocaleString('ru-RU')} ₽</b></span>`+
    `<span class="note">${m.note||''}</span>`;
  $('#updatedAt').textContent = 'обновлено ' + new Date(DATA.updated).toLocaleString('ru-RU',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit',timeZone:'Europe/Moscow'});

  const t0 = todayISO();
  const dayDates = [...new Set([t0, addDays(t0,1), ...DATA.tasks.filter(t=>t.day && t.day>=t0).map(t=>t.day)])].sort();
  const noteFor = d => (DATA.days.find(x=>x.date===d)||{}).note || '';
  let html = '';
  for(const d of dayDates){
    const list = DATA.tasks.filter(t=>t.day===d);
    const done = list.filter(t=>t.done).length;
    html += `<div class="col ${d===t0?'today':''}">
      <h2>${d===t0?'🔥 ':''}${dayName(d)} <span class="cnt">${done}/${list.length}</span></h2>
      <div class="cap">${noteFor(d)}</div>
      ${list.length?`<div class="progress"><i style="width:${list.length?Math.round(done/list.length*100):0}%"></i></div>`:''}
      ${list.map(taskHTML).join('') || '<div class="cap">пусто — перетащи из бэклога селектом</div>'}
      ${addForm(d)}
    </div>`;
  }
  // бэклог по направлениям
  const backlog = DATA.tasks.filter(t=>!t.day || t.day<t0 && !t.done);
  let bl = '';
  for(const [k,dir] of Object.entries(DATA.dirs)){
    const list = backlog.filter(t=>t.dir===k && !t.done);
    if(!list.length) continue;
    bl += `<div class="backlog-group"><h3>${dir.emoji} ${dir.name}</h3>${list.map(taskHTML).join('')}</div>`;
  }
  html += `<div class="col"><h2>📥 Бэклог <span class="cnt">${backlog.filter(t=>!t.done).length}</span></h2><div class="cap">без даты — раздаётся по дням утром</div>${bl}${addForm('')}</div>`;
  $('#board').innerHTML = html;
}

window.toggle = id => { const t=DATA.tasks.find(t=>t.id===id); t.done=!t.done; render(); scheduleSave(); };
window.move   = (id,day) => { const t=DATA.tasks.find(t=>t.id===id); t.day=day||null; render(); scheduleSave(); };
window.del    = id => { if(!confirm('Удалить задачу?')) return; DATA.tasks=DATA.tasks.filter(t=>t.id!==id); render(); scheduleSave(); };
window.addTask= (input,day) => {
  const title = input.value.trim(); if(!title) return;
  const dir = input.parentElement.querySelector('select').value;
  DATA.tasks.push({ id:'t'+Date.now().toString(36), title, dir, est:'', day:day||null, done:false });
  render(); scheduleSave();
};

window.saveToken = async () => {
  const v = $('#tokenInput').value.trim();
  if(!v) return;
  localStorage.setItem('bb_token', v);
  $('#setupErr').textContent = 'Проверяю…';
  try{ await boot(); }catch(e){ localStorage.removeItem('bb_token'); $('#setupErr').textContent = 'Не подошёл: '+e.message+'. Проверь права (Contents: Read and write) и репозиторий.'; }
};
window.resetToken = () => { localStorage.removeItem('bb_token'); location.reload(); };

async function boot(){
  if(!token()){ $('#setup').hidden=false; return; }
  await load();
  $('#setup').hidden = true;
  $('#app').hidden = false;
  setState('ok','✓');
  render();
}
boot().catch(e=>{ $('#setup').hidden=false; $('#setupErr').textContent = 'Токен не сработал ('+e.message+') — введи заново.'; });
</script>
</body>
</html>
